name: VANTA image model contract checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  image-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Node dependencies
        run: npm install --omit=dev --no-audit --no-fund
      - name: Install mobile browser verifier
        run: npm install --no-save --no-audit --no-fund playwright-core@1.56.1
      - name: Verify mobile Agent layout with real Chromium
        run: node scripts/test-agent-mobile-browser.mjs
      - name: Save viewport screenshots for UI review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-dashboard-mobile-screenshots
          path: /tmp/vanta-agent-mobile-screens/*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Verify Grok model, VANTA menus, and preserved image workflows
        run: |
          NODE_ENV=production node --test scripts/test-agent-bridge.mjs
          node --check server.js
          node --check public/app.js
          node --check public/kie-ui.js
          node scripts/test-grok-image-2.mjs
          node scripts/test-kie-dashboard.mjs
          node scripts/test-create-bootstrap.mjs
          node scripts/test-kie-incremental-references.mjs
          node scripts/test-nora-gallery-history.mjs
          node scripts/test-history-orphan-recovery.mjs
