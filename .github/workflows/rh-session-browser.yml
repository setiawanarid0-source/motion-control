name: RunningHub session export channels
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  popup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, edge, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          npm install --omit=dev --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright-core@1.56.1
      - name: Install Firefox or WebKit
        if: matrix.browser == 'firefox' || matrix.browser == 'webkit'
        run: npx playwright-core install --with-deps ${{ matrix.browser }}
      - name: Install Microsoft Edge
        if: matrix.browser == 'edge'
        run: |
          if [ ! -x /opt/microsoft/msedge/msedge ]; then
            npx playwright-core install msedge
          fi
      - name: Verify token popup and copy fallback
        run: node scripts/test-rh-session-browser.mjs
        env:
          RH_TEST_BROWSER: ${{ matrix.browser }}
      - name: Save synthetic-session screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runninghub-session-${{ matrix.browser }}
          path: /tmp/vanta-rh-export-*.png
          if-no-files-found: ignore
          retention-days: 3
  isolated-extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test browser
        run: |
          npm install --no-save --no-audit --no-fund playwright-core@1.56.1
          npx playwright-core install --with-deps chromium
      - name: Verify isolated extension with strict page CSP
        run: node scripts/test-rh-session-extension.mjs
      - name: Save synthetic-session screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runninghub-session-isolated-extension
          path: /tmp/vanta-rh-extension-*.png
          if-no-files-found: ignore
          retention-days: 3
